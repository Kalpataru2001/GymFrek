<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#orangeGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Dumbbell Graphics -->
  <g transform="translate(256, 230)">
    <!-- Center bar -->
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="url(#orangeGrad)"/>
    <!-- Center knurling rings -->
    <rect x="-50" y="-16" width="100" height="32" rx="6" fill="#fdba74" fill-opacity="0.4"/>

    <!-- Inner collar left &amp; right -->
    <rect x="-126" y="-38" width="20" height="76" rx="10" fill="#ea580c"/>
    <rect x="106" y="-38" width="20" height="76" rx="10" fill="#ea580c"/>

    <!-- Main inner plates -->
    <rect x="-154" y="-80" width="24" height="160" rx="12" fill="url(#orangeGrad)"/>
    <rect x="130" y="-80" width="24" height="160" rx="12" fill="url(#orangeGrad)"/>

    <!-- Outer large plates -->
    <rect x="-178" y="-64" width="20" height="128" rx="10" fill="#c2410c"/>
    <rect x="158" y="-64" width="20" height="128" rx="10" fill="#c2410c"/>

    <!-- Outer caps -->
    <rect x="-194" y="-20" width="14" height="40" rx="7" fill="#ea580c"/>
    <rect x="180" y="-20" width="14" height="40" rx="7" fill="#ea580c"/>
  </g>

  <!-- Flame / Energy Accent above dumbbell -->
  <path d="M256,90 C268,135 295,150 280,185 C275,170 262,160 256,155 C250,165 240,172 232,185 C217,150 244,135 256,90 Z" fill="url(#orangeGrad)"/>
  <path d="M256,120 C262,145 275,155 268,175 C264,166 258,160 256,157 C254,162 248,166 244,175 C237,155 250,145 256,120 Z" fill="#ffedd5"/>

  <!-- App Name Label -->
  <text x="256" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="60" fill="#ffffff" letter-spacing="4">GYM<tspan fill="#f97316">FREK</tspan></text>
  <text x="256" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="20" fill="#94a3b8" letter-spacing="8">ELEVATE YOUR LIFE</text>
</svg>